BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*.bb"

BBFILE_COLLECTIONS += "dht22"
BBFILE_PATTERN_dht22 = "^${LAYERDIR}/"
BBFILE_PRIORITY_dht22 = "10"
LAYERDEPENDS_dht22 = "core openembedded-layer raspberrypi"
LAYERSERIES_COMPAT_dht22 = "scarthgap"

# Ship the dht11 overlay (kernel dht11 IIO driver also handles DHT22) on the boot partition.
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/dht11.dtbo"

# Load the dht11 driver (also handles DHT22) at boot.
KERNEL_MODULE_AUTOLOAD += "dht11"

# config.txt: DHT22 on GPIO4 via the dht11 overlay, plus disable-bt so the
# serial console uses the stable PL011 UART (the Pi 3 mini UART garbles text).
# Must be ONE assignment: a second "RPI_EXTRA_CONFIG =" overwrites the first.
RPI_EXTRA_CONFIG = "dtoverlay=dht11,gpiopin=4\ndtoverlay=disable-bt"

# Keep kernel error messages (e.g. dht11 "Only 0 signal edges detected")
# off the serial console; they are still visible with dmesg.
CMDLINE_DEBUG = "loglevel=3"

# Add the app, driver and gpioset/gpioget tools to the image (core-image-minimal).
IMAGE_INSTALL:append = " dht22 kernel-module-dht11 libgpiod-tools"
