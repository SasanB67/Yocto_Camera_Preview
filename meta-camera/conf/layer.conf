# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-camera"
BBFILE_PATTERN_meta-camera = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-camera = "10"

LAYERDEPENDS_meta-camera = "core raspberrypi multimedia-layer"
LAYERSERIES_COMPAT_meta-camera = "scarthgap"

#
# Raspberry Pi 3 + Camera Module V2 (IMX219) -> live preview on HDMI
#
# Adds "dtoverlay=imx219" to config.txt (enables bcm2835-unicam + imx219 for libcamera)
RASPBERRYPI_CAMERA_V2 = "1"

# Full KMS display driver (default on RPi3 is vc4-fkms-v3d, which breaks rpicam DRM preview)
# VC4DTBO = "vc4-kms-v3d"

# SSH access (dropbear)
# EXTRA_IMAGE_FEATURES:append = " ssh-server-dropbear"

# Camera preview on HDMI (pulls in libcamera, libcamera-apps, v4l-utils)
# kernel-modules: core-image-minimal doesn't install them by default, and imx219,
# bcm2835-unicam, bcm2835-isp and vc4 are all built as modules
CORE_IMAGE_EXTRA_INSTALL:append = " camera-preview kernel-modules"

# Required by linux-firmware-rpidistro (RPi3 Wi-Fi/BT firmware)
# LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"

# Build SD-card image (.wic.bz2) with a .bmap for bmaptool
# IMAGE_FSTYPES = "wic.bz2 wic.bmap"

# Keep HDMI console from blanking
CMDLINE:append = " consoleblank=0"
